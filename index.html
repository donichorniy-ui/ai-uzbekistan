<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Uzbekistan — Сборник знаний по ИИ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(90deg, #4F46E5, #9333EA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold gradient-text">AI Uzbekistan</div>
            <a href="https://t.me/your_bot_username" class="bg-indigo-600 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-indigo-700 transition">
                Присоединиться к каналу
            </a>
        </div>
    </header>

    <section class="py-16 px-4 text-center max-w-3xl mx-auto">
        <h1 class="text-4xl md:text-6xl font-bold mb-6">Все об ИИ в <span class="gradient-text">Узбекистане</span></h1>
        <p class="text-gray-600 text-lg mb-8">Актуальные новости, бесплатные приложения, инструкции по локальному запуску LLM и секретные фишки нейросетей.</p>
    </section>

    <main class="max-w-5xl mx-auto px-4 pb-20">
        <div id="news-container" class="grid gap-8 md:grid-cols-2">
            <div class="col-span-full text-center py-10 text-gray-400">Загрузка новостей...</div>
        </div>
    </main>

    <script>
        async function loadNews() {
            try {
                const response = await fetch('/news.json');
                const news = await response.json();
                const container = document.getElementById('news-container');
                container.innerHTML = '';

                news.forEach(item => {
                    const card = `
                        <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition">
                            <div class="flex gap-2 mb-3">
                                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-1 rounded">Новость</span>
                            </div>
                            <h2 class="text-xl font-bold mb-2">${item.title_ru}</h2>
                            <p class="text-gray-600 mb-4">${item.summary_ru}</p>
                            <div class="bg-gray-50 p-4 rounded-lg mb-4 text-sm border-l-4 border-indigo-500">
                                <strong class="block mb-1">🇺🇿 Почему это важно:</strong> ${item.benefit_ru}
                            </div>
                            <div class="border-t pt-4 flex justify-between items-center">
                                <a href="${item.url}" target="_blank" class="text-indigo-600 font-medium hover:underline">Читать оригинал $\rightarrow$</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (e) {
                document.getElementById('news-container').innerHTML = '<div class="col-span-full text-center py-10 text-red-400">Ошибка загрузки контента</div>';
            }
        }
        loadNews();
    </script>
</body>
</html>
